server:
  port: 8964

spring:
  application:
    name: stock-monitor
  datasource:
    url: jdbc:mysql://localhost:3306/stock?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    show-sql: false
  # 邮件SMTP（仅在配置 host 后才创建 JavaMailSender；以QQ邮箱为例，授权码放环境变量 MAIL_PASS）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 8000
          timeout: 10000
          writetimeout: 10000

# 行情数据源
# 注：本机网络下东方财富K线域名(push2his)不可达，默认主数据源用腾讯(@Primary TencentProvider)；
# 东方财富适配器保留作为备选，网络可达时可切换。
market:
  provider: TENCENT
  tencent:
    kline-url: https://web.ifzq.gtimg.cn/appstock/app/fqkline/get
  eastmoney:
    kline-url: https://push2his.eastmoney.com/api/qt/stock/kline/get
    quote-url: https://push2.eastmoney.com/api/qt/stock/get
  fetch:
    history-bars: 250        # 日K回补根数，满足 TD9/MACD/MA60/背离窗口
    connect-timeout-ms: 5000
    read-timeout-ms: 8000

# 策略参数（神奇九转 + 组合过滤），均可调
strategy:
  td-setup-length: 9
  macd: {fast: 12, slow: 26, signal: 9}
  divergence: {window: 60, swing-k: 2}
  volume:
    shrink-days: 5
    ma-period: 20
    surge-ratio: 1.8
    stall-change-pct: 1.0
  ma-support:
    periods: [20, 60]
    tolerance: 0.02
  bias:
    ma20-far: 15.0
    ma60-far: 25.0
  combo-mode: SCORE          # SCORE 加权打分 / STRICT 严格四要素
  score-threshold: 0         # 除必备低9/高9外，命中加分项 >=2 预警，满3为强信号

# 盘中实时扫描调度
schedule:
  intraday-enabled: true
  intraday-interval-ms: 300000          # 每5分钟扫描一次
  trade-sessions:
    - "09:30-11:30"
    - "13:00-15:00"
  holidays: []                          # 法定节假日 yyyy-MM-dd，可补充
  force-scan: false                     # true 则忽略交易时段强制扫描(调试)
  thread-pool-size: 8
  rate-per-second: 8
  retry: 3
  prefetch-history-cron: "0 15 9 * * MON-FRI"   # 盘前回补历史日K
  eod-finalize-cron: "0 5 15 * * MON-FRI"        # 收盘后定稿当日K线落库

# 预警输出（企业微信机器人 / 邮件）
alert:
  channels:
    - WECOM
    - CONSOLE
    - EMAIL
  wecom-webhook-key: ${WECOM_KEY:}      # 环境变量注入，勿入库/入仓
  wecom-webhook-url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send
  cooldown-days: 1
  # 邮件渠道：SMTP 服务器见上方 spring.mail.*；下面填收发件人
  email-from: ${MAIL_USER:}    # 留空则用 spring.mail.username
  email-to:
    - ${MAIL_TO:}              # 收件人，可配多个
  email-subject-prefix: "[选股预警]"

# AI 情感分析（DeepSeek）。设 enabled=true 并填 api-key 后启用；否则新闻只入库不判情感。
ai:
  deepseek:
    enabled: true
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}  # 环境变量注入，勿入库/入仓
    model: deepseek-v4-flash       # 受支持: deepseek-v4-flash / deepseek-v4-pro

logging:
  level:
    com.stock: INFO
