server:
  port: ${SERVER_PORT:8964}

spring:
  application:
    name: stock-monitor
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stock?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    show-sql: false
  # 邮件 SMTP：密码等敏感项只从环境变量读取，勿写入仓库
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 8000
          timeout: 10000
          writetimeout: 10000

# 行情数据源
# 注：本机网络下东方财富K线域名(push2his)不可达，默认主数据源用腾讯(@Primary TencentProvider)；
# 东方财富适配器保留作为备选，网络可达时可切换。
market:
  provider: TENCENT
  tencent:
    kline-url: https://web.ifzq.gtimg.cn/appstock/app/fqkline/get
  eastmoney:
    kline-url: https://push2his.eastmoney.com/api/qt/stock/kline/get
    quote-url: https://push2.eastmoney.com/api/qt/stock/get
  fetch:
    history-bars: 250        # 日K回补根数，满足 TD9/MACD/MA60/背离窗口
    connect-timeout-ms: 5000
    read-timeout-ms: 8000

# 策略参数（神奇九转 + 组合过滤），均可调
strategy:
  td-setup-length: 9
  macd: {fast: 12, slow: 26, signal: 9}
  divergence: {window: 60, swing-k: 2}
  volume:
    shrink-days: 5
    ma-period: 20
    surge-ratio: 1.8
    stall-change-pct: 1.0
  ma-support:
    periods: [20, 60]
    tolerance: 0.02
  bias:
    ma20-far: 15.0
    ma60-far: 25.0
  trade-plan:
    soft-stop-duration-minutes: 60      # 实时价连续低于止损价1小时后退出
    soft-stop-max-check-gap-minutes: 10 # 午休、停机或漏扫后重新计时
    hard-stop-below-pct: 2.0            # 跌至止损价下方2%立即退出
  combo-mode: SCORE          # SCORE 加权打分 / STRICT 严格四要素
  score-threshold: 0         # 除必备低9/高9外，命中加分项 >=2 预警，满3为强信号

# 盘中实时扫描调度
schedule:
  intraday-enabled: true
  intraday-interval-ms: 300000          # 每5分钟扫描一次
  trade-sessions:
    - "09:30-11:30"
    - "13:00-15:00"
  holidays: []                          # 法定节假日 yyyy-MM-dd，可补充
  force-scan: false                     # true 则忽略交易时段强制扫描(调试)
  thread-pool-size: 8
  rate-per-second: 8
  retry: 3
  prefetch-history-cron: "0 15 9 * * MON-FRI"   # 盘前回补历史日K
  eod-finalize-cron: "0 5 15 * * MON-FRI"        # 收盘后定稿当日K线落库

# 预警输出（企业微信机器人 / 邮件）
alert:
  channels:
    - WECOM
    - CONSOLE
    - EMAIL
  wecom-webhook-key: ${WECOM_KEY:}
  wecom-webhook-url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send
  cooldown-days: 1
  email-from: ${MAIL_FROM:${MAIL_USER:}}
  email-to:
    - ${MAIL_TO:}
  email-subject-prefix: "[选股预警]"

# AI 情感分析（DeepSeek）。enabled=true 且配置 DEEPSEEK_API_KEY 后启用
ai:
  deepseek:
    enabled: ${AI_ENABLED:false}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}

logging:
  level:
    com.stock: INFO
