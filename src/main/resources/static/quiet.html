<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>行情</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background: #16181d; color: #c9ccd2;
            font-family: "Microsoft YaHei", "Segoe UI", Tahoma, sans-serif;
            font-size: 13px;
        }
        .board { width: 100%; max-width: 560px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 7px 12px; white-space: nowrap; }
        thead th {
            background: #1f222a; color: #8b9099; font-weight: normal;
            text-align: right; border-bottom: 1px solid #2a2e37;
        }
        thead th.l, tbody td.l { text-align: left; }
        tbody td { text-align: right; border-bottom: 1px solid #20232b; color: #c9ccd2; }
        tbody tr:nth-child(even) td { background: #181b21; }
        .name { color: #e6e8eb; }
        .code { color: #7d828b; }
        .statusbar {
            display: flex; justify-content: space-between;
            padding: 8px 12px; color: #6f747d; font-size: 12px;
            border-top: 1px solid #2a2e37; background: #1a1d24;
        }
        .statusbar .sig { color: #9aa0a8; }
    </style>
</head>
<body>
<div class="board">
    <table>
        <thead>
        <tr>
            <th class="l">名称</th>
            <th class="l">代码</th>
            <th>当前</th>
            <th>涨跌</th>
            <th>涨跌幅</th>
        </tr>
        </thead>
        <tbody id="rows">
        <tr><td class="l" colspan="5" style="color:#6f747d">加载中…</td></tr>
        </tbody>
    </table>
    <div class="statusbar">
        <span id="refresh">最后刷新 --:--:--</span>
        <span class="sig" id="lastSignal">最后信号 无</span>
    </div>
</div>
<script src="quiet.js"></script>
</body>
</html>
